name: Bug report
description: 报告一个可以复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先确认没有在已有 Issue 中报告过同一问题。
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: v1.1.5
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 平台与设备
      placeholder: Android 14 / Pixel 7
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请按顺序描述触发问题的操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与日志
      description: 请移除课表、账号、密钥等敏感信息。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已移除截图、日志和描述中的个人或敏感信息。
          required: true
